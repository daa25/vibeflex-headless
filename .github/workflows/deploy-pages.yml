name: Deploy VibeFlex to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "vibeflex-studio-pages/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare combined Pages artifact
        run: |
          rm -rf .pages
          mkdir -p .pages
          cp -R site/. .pages/
          mkdir -p .pages/studio
          cp -R vibeflex-studio-pages/. .pages/studio/
          rm -rf .pages/studio/supabase
          touch .pages/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
